services:
  # Not published to the host: the backend reaches Redis over the Compose
  # network as redis:6379. Publishing it collided with whatever already held
  # 6379 on the production host, and exposed an unauthenticated Redis to every
  # network that host is on.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Also unpublished: nginx proxies to backend:8080 over the Compose network,
  # so a host port would only offer a way to reach the API around nginx.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: ${SERVER_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_build:/output

  nginx:
    image: nginx:alpine
    ports:
      - "80"
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT}
      # Only substitute R2_* placeholders, so nginx's own $host/$uri variables
      # survive templating untouched.
      NGINX_ENVSUBST_FILTER: "R2_"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
      - ./nginx/mime.types:/etc/nginx/mime.types
      - frontend_build:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

volumes:
  frontend_build:
